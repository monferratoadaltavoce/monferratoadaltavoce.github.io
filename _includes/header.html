<header class="site-header">
  <div class="container site-header__inner">
    <a href="{{ '/' | relative_url }}" class="site-logo" aria-label="{{ site.title }} — Home">
      <img src="{{ '/assets/img/site/logo@2x.png' | relative_url }}"
           srcset="{{ '/assets/img/site/logo.png' | relative_url }} 1x, {{ '/assets/img/site/logo@2x.png' | relative_url }} 2x, {{ '/assets/img/site/logo@3x.png' | relative_url }} 3x"
           alt="{{ site.title }}" width="320">
    </a>

    <button class="nav-toggle" aria-controls="primary-nav" aria-expanded="false" aria-label="Apri menu">
      <span></span><span></span><span></span>
    </button>

    <nav id="primary-nav" class="site-nav" aria-label="Primario">
      <ul>
        {% for item in site.data.nav %}
          {% assign current = false %}
          {% if page.url == item.url %}{% assign current = true %}{% endif %}
          <li{% if current %} class="is-current"{% endif %}>
            <a href="{{ item.url | relative_url }}"{% if item.cta %} class="cta"{% endif %}>{{ item.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>

<script>
  (function () {
    var btn = document.querySelector('.nav-toggle');
    var nav = document.getElementById('primary-nav');
    if (!btn || !nav) return;
    btn.addEventListener('click', function () {
      var open = nav.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  })();
</script>
