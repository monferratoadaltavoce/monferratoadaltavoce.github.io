<section class="hero hero--banner" aria-label="Monferrato ad alta voce">
  <div class="hero-media" aria-hidden="true">
    <div class="hero-img" style="background-image: url('{{ '/assets/uploads/2026/05/banner_wide.png' | relative_url }}');"></div>
    <img src="{{ '/assets/img/site/skyline.png' | relative_url }}" alt="" class="hero-skyline" loading="eager">
  </div>

  <div class="container hero-content">
    <h1>Monferrato ad alta voce</h1>
    <p class="hero-tagline">{{ site.tagline }}</p>
    <p class="hero-subtagline">{{ site.edizione.numero }} edizione · {{ site.edizione.date_label }}</p>
    <p class="hero-meta"><span>{{ site.edizione.comune }}</span><span class="sep">·</span><span>Ideato e diretto da <strong>Marco Pagani</strong></span></p>
    <a href="{{ '/programma/' | relative_url }}" class="btn btn--shine">Scopri il programma</a>
  </div>

  <div class="hero-scroll-hint" aria-hidden="true">
    <span></span>
  </div>
</section>
