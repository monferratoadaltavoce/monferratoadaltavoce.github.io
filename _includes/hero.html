<section class="hero hero--banner" aria-label="Monferrato ad alta voce">
  <div class="hero-media" aria-hidden="true">
    <div class="hero-img hero-img--a" style="background-image: url('{{ '/assets/uploads/2025/06/header_OK-tiny.jpg' | relative_url }}');"></div>
    <div class="hero-img hero-img--b" style="background-image: url('{{ '/assets/uploads/2023/03/home.jpg' | relative_url }}');"></div>
    <div class="hero-scrim"></div>
    <img src="{{ '/assets/img/site/skyline.png' | relative_url }}" alt="" class="hero-skyline" loading="eager">
  </div>

  <div class="container hero-content">
    <p class="hero-kicker">{{ site.edizione.numero }} edizione · {{ site.edizione.date_label }}</p>
    <h1>{{ site.title | downcase }}</h1>
    <p class="hero-tagline">«{{ site.edizione.tema }}»</p>
    <p class="hero-meta"><span>{{ site.edizione.comune }}</span><span class="sep">·</span><span>Ideato e diretto da <strong>Marco Pagani</strong></span></p>
    <a href="{{ '/programma/' | relative_url }}" class="btn btn--shine">Scopri il programma</a>
  </div>

  <div class="hero-scroll-hint" aria-hidden="true">
    <span></span>
  </div>
</section>
