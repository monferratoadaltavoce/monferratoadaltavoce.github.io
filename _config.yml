title: Monferrato ad Alta Voce
tagline: Sussurri d’arte tra le colline
description: >-
  Festival di musica e parole a Grazzano Badoglio (Asti), nel cuore del
  Monferrato Patrimonio UNESCO. Ideato e diretto da Marco Pagani.
url: "https://monferratoadaltavoce.it"
lang: it
locale: it_IT

# Current edition (drives the home page hero)
edizione:
  numero: Sesta
  numero_int: 6
  anno: 2026
  date_label: "12-13-14 giugno 2026"
  date_iso_start: "2026-06-12"
  date_iso_end: "2026-06-14"
  tema: "C’era una volta la Merica"
  tema_sub: "Tre giorni per ricucire la frattura culturale che la storia recente ha creato tra noi e l’America con il filo dell’arte, della musica, della letteratura."
  comune: "Grazzano Badoglio (AT)"

# Contact and reservations
contatti:
  email: "info@monferratoadaltavoce.it"
  telefono_pranzo: "+39 328 83 35 609"
  social:
    facebook: "https://www.facebook.com/monferratoadaltavoce"
    instagram: "https://www.instagram.com/monferratoadaltavoce/"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
sass:
  style: compressed
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

exclude:
  - README.md
  - CLAUDE.md
  - design.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - assets/uploads/_download.log
