---
layout: default
---
<article class="page">
  {% if page.title %}
  <header class="page-header">
    <div class="container">
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif %}
    </div>
  </header>
  {% endif %}

  <div class="container content">
    {{ content }}
  </div>

  <img src="{{ '/assets/img/site/skyline.png' | relative_url }}" alt="" class="skyline" loading="lazy">
</article>
