# Festival venues — single source of truth for the map shown on
# /programma/ and /prenota/. Render via {% include luoghi-map.html %}.
#
# Each entry:
#   n        — pin number shown on the map (1..N)
#   name     — short venue name (legend)
#   subtitle — optional secondary line (e.g. "Chiostro · Terrazzo")
#   address  — street address shown beneath the name
#   lat,lng  — geographic coordinates; drive both the pin position on the SVG
#              (projected with a cos(45°) longitude correction) and the
#              Google Maps link `?q=lat,lng` that opens in the user's maps app
#   type     — "show" (performance, brand-red) or "food" (warm amber)
#   when     — optional list of event mentions at this venue (free text)

